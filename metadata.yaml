name: astrbot_plugin_long_memory_agent
display_name: Sparking · 星火
short_desc: 星火 —— 让你的 Bot 像真人一样：会聊天、记得住、有情绪，还会自己找事做
desc: |
  一点星火，把"问答机器"烧成群里那个真人。
  它会像人一样短句连发地聊天、记得你说过的每句话、情绪随聊天起落，
  自己发表情包、看得懂合并聊天记录，也会不等你 @ 就主动接话、挂人、打理心情；
  记忆跨群共享——同一个人在各个群只有一份印象，A 群的老梗在私聊里也接得上。
version: v1.0.2
author: Rikka0612
